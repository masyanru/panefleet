name: Bug report
description: Report a reproducible PaneFleet problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a PaneFleet bug. Please remove secrets, prompts, and personal paths from logs and screenshots.

  - type: input
    id: version
    attributes:
      label: PaneFleet version
      description: Release tag or commit SHA
      placeholder: v0.1.0-alpha.1
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: macOS and hardware
      placeholder: macOS 26.0, Apple M3
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Workspaces and tabs
        - Terminal
        - Codex
        - Claude
        - OpenCode
        - Files / Changes / Review
        - Settings
        - Installation or packaging
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open workspace…
        2. Open agent…
        3. Switch workspace…
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or sanitized logs
      description: Drag files here. Remove tokens, prompts, session contents, and private paths.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing PaneFleet issues.
          required: true
        - label: I removed confidential information from the report.
          required: true
