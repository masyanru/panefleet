name: Feature request
description: Propose an improvement to PaneFleet
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the workflow problem first. A mock or screenshot is especially useful for UI proposals.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult today, and for whom?
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior
      description: Explain the expected workspace, tab, terminal, or agent workflow.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: references
    attributes:
      label: Mockups or references
      description: Drag screenshots here or link relevant prior art.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing PaneFleet issues.
          required: true
