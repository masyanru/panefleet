name: PaneFleet CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: panefleet-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: Format and check
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Cache Cargo data
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Install protobuf compiler
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install protobuf

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Validate packaging scripts
        run: |
          bash -n script/generate-panefleet-macos-icon
          bash -n script/package-panefleet-macos

      - name: Check PaneFleet
        run: cargo check -p warp --bin panefleet

      - name: Run PaneFleet tests
        run: cargo test -p warp panefleet
