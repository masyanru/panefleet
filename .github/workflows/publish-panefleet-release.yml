name: Publish PaneFleet release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag to package and publish
        required: true
        type: string
  push:
    branches:
      - "release/v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - name: Select release source
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_version="${{ inputs.version }}"
          else
            release_version="${GITHUB_REF_NAME#release/}"
          fi

          git fetch --force origin "refs/tags/$release_version:refs/tags/$release_version"
          git checkout "$release_version"
          echo "PANEFLEET_VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Install packaging dependencies
        run: |
          brew install protobuf
          cargo install cargo-bundle --locked

      - name: Build release archive
        run: ./script/package-panefleet-macos "$PANEFLEET_VERSION"

      - name: Upload GitHub release assets
        run: |
          gh release upload "$PANEFLEET_VERSION" \
            "target/panefleet-dist/PaneFleet-$PANEFLEET_VERSION-macos-arm64.zip" \
            "target/panefleet-dist/PaneFleet-$PANEFLEET_VERSION-macos-arm64.zip.sha256" \
            --clobber
